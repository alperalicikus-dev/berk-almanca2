<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesen Trainer — TELC B2/C1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0e0c;
  --bg2: #181714;
  --bg3: #221f1a;
  --bg4: #2c2822;
  --line: rgba(255,255,255,0.07);
  --line2: rgba(255,255,255,0.12);
  --text: #e8e2d8;
  --text2: #a09890;
  --text3: #6b6158;
  --gold: #d4a84b;
  --gold2: #f0c87a;
  --gold-dim: rgba(212,168,75,0.15);
  --teal: #4ab8a8;
  --teal-dim: rgba(74,184,168,0.12);
  --red: #e05252;
  --red-dim: rgba(224,82,82,0.12);
  --green: #52b788;
  --green-dim: rgba(82,183,136,0.12);
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Source Serif 4', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.7;
}

/* HEADER */
header {
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--text);
  letter-spacing: -0.3px;
}
.logo em { color: var(--gold); font-style: italic; }
.header-right { display: flex; gap: 10px; align-items: center; }
.level-toggle {
  display: flex;
  background: var(--bg3);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
  border: 1px solid var(--line);
}
.level-btn {
  padding: 5px 16px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border-radius: 6px;
  transition: all .2s;
  letter-spacing: .08em;
}
.level-btn.active { background: var(--gold); color: var(--bg); }
.score-display {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: .06em;
}

/* LAYOUT */
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 28px 24px;
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 20px;
}

/* SIDEBAR */
.sidebar { display: flex; flex-direction: column; gap: 14px; }
.panel {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 7px;
}
.panel-body { padding: 14px 16px; }

/* TYPE SELECTOR */
.type-list { display: flex; flex-direction: column; gap: 5px; }
.type-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s;
}
.type-item:hover { background: var(--bg3); }
.type-item.selected { background: var(--gold-dim); border-color: var(--gold); }
.type-item .type-name { font-size: 12px; font-weight: 600; font-family: 'Source Serif 4', serif; color: var(--text); margin-bottom: 2px; }
.type-item .type-desc { font-size: 11px; color: var(--text3); line-height: 1.4; font-family: 'JetBrains Mono', monospace; }
.type-item.selected .type-name { color: var(--gold2); }

/* PROGRESS */
.progress-list { display: flex; flex-direction: column; gap: 10px; }
.prog-row { display: flex; flex-direction: column; gap: 4px; }
.prog-label { display: flex; justify-content: space-between; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
.prog-label .name { color: var(--text2); }
.prog-label .val { color: var(--gold); }
.prog-bar-bg { height: 4px; background: var(--bg4); border-radius: 2px; }
.prog-bar { height: 4px; border-radius: 2px; background: var(--gold); transition: width .5s ease; }

/* STRATEGIES */
.strat-list { display: flex; flex-direction: column; gap: 8px; }
.strat { display: flex; gap: 8px; font-size: 12px; color: var(--text2); line-height: 1.5; }
.strat-icon { color: var(--gold); font-size: 14px; flex-shrink: 0; }

/* WORKSPACE */
.workspace { display: flex; flex-direction: column; gap: 18px; }

/* TASK CARD */
.task-card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.task-header {
  padding: 14px 20px;
  background: var(--bg3);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.task-meta {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.task-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gold);
}
.task-type-title {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  color: var(--text);
}
.btn-gen {
  background: var(--gold);
  color: var(--bg);
  border: none;
  padding: 9px 18px;
  border-radius: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .04em;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-gen:hover { background: var(--gold2); }
.btn-gen:disabled { opacity: .4; cursor: not-allowed; }

/* TEXT AREA */
.text-container {
  padding: 22px 24px;
  border-bottom: 1px solid var(--line);
}
.text-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--gold2);
  margin-bottom: 6px;
  line-height: 1.35;
  font-style: italic;
}
.text-source {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  margin-bottom: 16px;
  letter-spacing: .05em;
}
.text-body {
  font-size: 14px;
  line-height: 1.85;
  color: var(--text);
  white-space: pre-wrap;
}
.text-body .highlight { background: rgba(212,168,75,0.2); border-radius: 3px; padding: 0 2px; }

/* LOADING */
.loading-area {
  padding: 40px;
  text-align: center;
  display: none;
}
.loading-area.show { display: block; }
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--line2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text3); }

/* EMPTY STATE */
.empty-area {
  padding: 52px 24px;
  text-align: center;
}
.empty-icon { font-size: 40px; margin-bottom: 14px; }
.empty-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text2); margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

/* QUESTIONS */
.questions-container {
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.question-block { display: flex; flex-direction: column; gap: 10px; }
.q-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.q-text {
  font-size: 14px;
  color: var(--text);
  font-weight: 600;
  line-height: 1.5;
}
.options-list { display: flex; flex-direction: column; gap: 6px; }
.option-btn {
  padding: 11px 15px;
  border-radius: 8px;
  border: 1px solid var(--line2);
  background: var(--bg3);
  color: var(--text2);
  font-family: 'Source Serif 4', serif;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  line-height: 1.5;
}
.option-btn:hover:not(:disabled) { border-color: var(--gold); background: var(--gold-dim); color: var(--text); }
.option-btn.selected { border-color: var(--gold); background: var(--gold-dim); color: var(--gold2); }
.option-btn.correct { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.option-btn.wrong { border-color: var(--red); background: var(--red-dim); color: var(--red); }
.option-btn:disabled { cursor: default; }
.opt-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  flex-shrink: 0;
  margin-top: 1px;
  opacity: .7;
}
.q-explanation {
  font-size: 12px;
  color: var(--teal);
  background: var(--teal-dim);
  border-radius: 6px;
  padding: 8px 12px;
  display: none;
  line-height: 1.6;
  font-family: 'JetBrains Mono', monospace;
}
.q-explanation.show { display: block; }

/* TRUE/FALSE */
.tf-options { display: flex; gap: 8px; }
.tf-btn {
  flex: 1;
  padding: 11px;
  border-radius: 8px;
  border: 1px solid var(--line2);
  background: var(--bg3);
  color: var(--text2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .06em;
  text-align: center;
}
.tf-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.tf-btn.selected { border-color: var(--gold); background: var(--gold-dim); color: var(--gold2); }
.tf-btn.correct { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.tf-btn.wrong { border-color: var(--red); background: var(--red-dim); color: var(--red); }
.tf-btn:disabled { cursor: default; }

/* SUBMIT AREA */
.submit-area {
  padding: 16px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.answered-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text3);
}
.btn-check {
  background: var(--teal);
  color: var(--bg);
  border: none;
  padding: 11px 24px;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .05em;
  display: flex;
  align-items: center;
  gap: 7px;
}
.btn-check:hover { background: #5dd0c0; }
.btn-check:disabled { opacity: .4; cursor: not-allowed; }

/* RESULT CARD */
.result-card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  display: none;
}
.result-card.show { display: block; }
.result-header {
  padding: 18px 22px;
  background: var(--bg3);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 18px;
}
.result-score-box {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  flex-shrink: 0;
  border: 2px solid var(--gold);
}
.result-score-num {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  color: var(--gold);
  line-height: 1;
}
.result-score-den { font-size: 10px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
.result-info { flex: 1; }
.result-title { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--text); margin-bottom: 4px; }
.result-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); }
.btn-next {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 9px 18px;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .05em;
  white-space: nowrap;
}
.btn-next:hover { background: var(--gold-dim); }

.result-breakdown {
  padding: 16px 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.breakdown-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.breakdown-icon { font-size: 14px; width: 20px; text-align: center; }
.breakdown-text { flex: 1; color: var(--text2); font-family: 'Source Serif 4', serif; }
.breakdown-status { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.status-ok { color: var(--green); }
.status-err { color: var(--red); }

/* GEN BUTTON standalone */
.gen-btn-wrap {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>

<header>
  <div class="logo">Lesen<em>trainer</em> <span style="font-family:'JetBrains Mono';font-size:10px;color:var(--text3);letter-spacing:.06em;margin-left:6px">TELC B2/C1</span></div>
  <div class="header-right">
    <div class="level-toggle">
      <button class="level-btn active" onclick="setLevel('B2')" id="btn-b2">B2</button>
      <button class="level-btn" onclick="setLevel('C1')" id="btn-c1">C1</button>
    </div>
    <div class="score-display">∑ <span id="total-score">0</span> / <span id="total-max">0</span></div>
  </div>
</header>

<main>
  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="panel">
      <div class="panel-header">📖 Aufgabentyp</div>
      <div class="panel-body">
        <div class="type-list" id="type-list"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">📈 Fortschritt</div>
      <div class="panel-body">
        <div class="progress-list" id="progress-list">
          <div class="prog-row">
            <div class="prog-label"><span class="name">Global lesen</span><span class="val" id="prog-global">0%</span></div>
            <div class="prog-bar-bg"><div class="prog-bar" id="bar-global" style="width:0%"></div></div>
          </div>
          <div class="prog-row">
            <div class="prog-label"><span class="name">Detail lesen</span><span class="val" id="prog-detail">0%</span></div>
            <div class="prog-bar-bg"><div class="prog-bar" id="bar-detail" style="width:0%"></div></div>
          </div>
          <div class="prog-row">
            <div class="prog-label"><span class="name">Selektiv lesen</span><span class="val" id="prog-selektiv">0%</span></div>
            <div class="prog-bar-bg"><div class="prog-bar" id="bar-selektiv" style="width:0%"></div></div>
          </div>
          <div class="prog-row" id="prog-implicit-row" style="display:none">
            <div class="prog-label"><span class="name">Implizit (C1)</span><span class="val" id="prog-implizit">0%</span></div>
            <div class="prog-bar-bg"><div class="prog-bar" id="bar-implizit" style="width:0%"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">💡 Strategie</div>
      <div class="panel-body">
        <div class="strat-list" id="strat-list"></div>
      </div>
    </div>

  </aside>

  <!-- WORKSPACE -->
  <div class="workspace">

    <div class="gen-btn-wrap" id="gen-btn-wrap">
      <button class="btn-gen" style="padding:14px 32px;font-size:13px" onclick="generateTask()" id="btn-gen-main">
        ✦ Aufgabe generieren
      </button>
    </div>

    <!-- TASK CARD -->
    <div class="task-card" id="task-card" style="display:none">
      <div class="task-header">
        <div class="task-meta">
          <div class="task-label" id="task-label">Leseverstehen · B2</div>
          <div class="task-type-title" id="task-type-title">—</div>
        </div>
        <button class="btn-gen" onclick="generateTask()" id="btn-regen">↻ Neue Aufgabe</button>
      </div>

      <div class="loading-area" id="loading-area">
        <div class="spinner"></div>
        <div class="loading-text">Text wird generiert…</div>
      </div>

      <div id="task-content" style="display:none">
        <div class="text-container" id="text-container">
          <div class="text-title" id="text-title"></div>
          <div class="text-source" id="text-source"></div>
          <div class="text-body" id="text-body"></div>
        </div>
        <div class="questions-container" id="questions-container"></div>
        <div class="submit-area">
          <div class="answered-count" id="answered-count">0 / 0 beantwortet</div>
          <button class="btn-check" onclick="checkAnswers()" id="btn-check">Auswerten →</button>
        </div>
      </div>
    </div>

    <!-- RESULT -->
    <div class="result-card" id="result-card">
      <div class="result-header">
        <div class="result-score-box">
          <div class="result-score-num" id="res-score">—</div>
          <div class="result-score-den" id="res-den">/ —</div>
        </div>
        <div class="result-info">
          <div class="result-title" id="res-title">—</div>
          <div class="result-sub" id="res-sub">—</div>
        </div>
        <button class="btn-next" onclick="generateTask()">Nächste Aufgabe →</button>
      </div>
      <div class="result-breakdown" id="result-breakdown"></div>
    </div>

  </div>
</main>

<script>
// ── STATE ──
let level = 'B2';
let selectedType = null;
let currentTask = null;
let userAnswers = {};
let checked = false;
let sessionScore = 0, sessionMax = 0;
let progData = JSON.parse(localStorage.getItem('lesen_prog') || '{"global":[],"detail":[],"selektiv":[],"implizit":[]}');

// ── TYPES ──
const types = {
  B2: [
    { id: 'global',   name: 'Teil 1 — Global lesen',    desc: '5 Texte · 10 Überschriften · Zuordnung' },
    { id: 'detail',   name: 'Teil 2 — Detail lesen',     desc: 'Populärwiss. · 5 MC-Fragen' },
    { id: 'selektiv', name: 'Teil 3 — Selektiv lesen',   desc: '5 Situationen · Kurztext-Zuordnung' },
  ],
  C1: [
    { id: 'global',   name: 'Teil 1 — Lücken & Kohärenz', desc: 'Satzstruktur, Pronomen, Referenz' },
    { id: 'detail',   name: 'Teil 2 — Meinungen lesen',   desc: 'Autorstimme, Adjektive, Wertungen' },
    { id: 'implizit', name: 'Teil 3 — Implizit lesen',    desc: 'Nicht explizit, Schlussfolgerung' },
  ]
};

const strategies = {
  global: [
    { icon: '👁', text: 'Erst Überschriften/Fragen lesen — dann Text.' },
    { icon: '⚡', text: 'Schnell überfliegen, Hauptidee erfassen.' },
    { icon: '🔑', text: 'Schlüsselwörter aus Frage im Text suchen.' },
  ],
  detail: [
    { icon: '🔍', text: 'Text Satz für Satz, parallel zur Frage lesen.' },
    { icon: '⚠', text: 'Achtung: Negationen! "nicht", "kaum", "selten"' },
    { icon: '📌', text: 'Richtig/Falsch: Nur im Text — nicht aus dem Wissen!' },
  ],
  selektiv: [
    { icon: '🎯', text: 'Situation zuerst lesen, dann gezielt im Text suchen.' },
    { icon: '❌', text: 'Nicht jeder Text hat eine passende Situation.' },
    { icon: '🔄', text: 'Jeder Text nur einmal verwenden!' },
  ],
  implizit: [
    { icon: '🧠', text: 'Was meint der Autor zwischen den Zeilen?' },
    { icon: '🎨', text: 'Ton, Ironie, Wertung des Autors identifizieren.' },
    { icon: '🔎', text: 'Unterschied: explizit gesagt vs. nur angedeutet.' },
  ],
};

// ── INIT ──
function init() {
  renderTypes();
  renderStrategies();
  updateProgress();
}

function renderTypes() {
  const list = document.getElementById('type-list');
  list.innerHTML = '';
  types[level].forEach(t => {
    const el = document.createElement('div');
    el.className = 'type-item' + (selectedType === t.id ? ' selected' : '');
    el.innerHTML = `<div class="type-name">${t.name}</div><div class="type-desc">${t.desc}</div>`;
    el.onclick = () => { selectedType = t.id; renderTypes(); renderStrategies(); };
    list.appendChild(el);
  });
}

function renderStrategies() {
  const key = selectedType || (level === 'B2' ? 'global' : 'global');
  const strats = strategies[key] || strategies.global;
  document.getElementById('strat-list').innerHTML = strats.map(s =>
    `<div class="strat"><span class="strat-icon">${s.icon}</span><span>${s.text}</span></div>`
  ).join('');
}

function setLevel(lvl) {
  level = lvl;
  selectedType = null;
  document.getElementById('btn-b2').classList.toggle('active', lvl === 'B2');
  document.getElementById('btn-c1').classList.toggle('active', lvl === 'C1');
  document.getElementById('prog-implicit-row').style.display = lvl === 'C1' ? 'flex' : 'none';
  renderTypes();
  renderStrategies();
  resetTask();
}

function resetTask() {
  document.getElementById('task-card').style.display = 'none';
  document.getElementById('gen-btn-wrap').style.display = 'flex';
  document.getElementById('result-card').classList.remove('show');
  currentTask = null;
  userAnswers = {};
  checked = false;
}

function updateProgress() {
  ['global','detail','selektiv','implizit'].forEach(k => {
    const arr = progData[k] || [];
    const pct = arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
    const el = document.getElementById('prog-' + k);
    const bar = document.getElementById('bar-' + k);
    if (el) el.textContent = pct + '%';
    if (bar) bar.style.width = pct + '%';
  });
}

// ── GENERATE ──
async function generateTask() {
  if (!selectedType) {
    // auto-select first
    selectedType = types[level][0].id;
    renderTypes();
    renderStrategies();
  }

  const typeObj = types[level].find(t => t.id === selectedType);
  document.getElementById('gen-btn-wrap').style.display = 'none';
  document.getElementById('task-card').style.display = 'block';
  document.getElementById('task-content').style.display = 'none';
  document.getElementById('loading-area').classList.add('show');
  document.getElementById('result-card').classList.remove('show');
  document.getElementById('btn-regen').disabled = true;
  document.getElementById('btn-gen-main') && (document.getElementById('btn-gen-main').disabled = true);

  document.getElementById('task-label').textContent = `Leseverstehen · ${level}`;
  document.getElementById('task-type-title').textContent = typeObj.name;

  userAnswers = {};
  checked = false;

  const prompt = buildPrompt(typeObj.id);

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
          'x-api-key': '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',
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2500,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await resp.json();
    const raw = data.content?.[0]?.text || '';
    const cleaned = raw.replace(/```json|```/g, '').trim();
    currentTask = JSON.parse(cleaned);
    renderTask(currentTask);
  } catch(e) {
    console.error(e);
    document.getElementById('loading-area').classList.remove('show');
    document.getElementById('task-content').style.display = 'block';
    document.getElementById('questions-container').innerHTML = '<p style="color:var(--red);font-size:13px">Fehler beim Generieren. Bitte nochmals versuchen.</p>';
  } finally {
    document.getElementById('btn-regen').disabled = false;
  }
}

// ── RENDER TASK ──
function renderTask(task) {
  document.getElementById('loading-area').classList.remove('show');
  document.getElementById('task-content').style.display = 'block';

  // Text area
  document.getElementById('text-title').textContent = task.titel || '';
  document.getElementById('text-source').textContent = task.quelle || '';

  const container = document.getElementById('text-container');
  const qContainer = document.getElementById('questions-container');
  qContainer.innerHTML = '';

  if (level === 'B2' && selectedType === 'global') {
    renderGlobalTask(task, container, qContainer);
  } else if (level === 'B2' && selectedType === 'selektiv') {
    renderSelektivTask(task, container, qContainer);
  } else if ((level === 'C1' && selectedType === 'global')) {
    renderLueckenTask(task, container, qContainer);
  } else {
    // detail / implizit / C1 detail
    renderDetailTask(task, container, qContainer);
  }

  updateAnsweredCount();
  document.getElementById('result-card').classList.remove('show');
}

    <div class="text-source">${task.quelle}</div>
    ${task.texte.map(t => `
      <div style="margin-bottom:16px;padding:14px;background:var(--bg3);border-radius:8px;border:1px solid var(--line)">
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);margin-bottom:6px">TEXT ${t.id}</div>
        <div class="text-body" style="font-size:13px">${t.text}</div>
      </div>
    `).join('')}
  `;

  // Überschriften grid
  const headerGrid = document.createElement('div');
  headerGrid.style.cssText = 'padding:16px 24px;border-bottom:1px solid var(--line)';
  headerGrid.innerHTML = `

function renderDetailTask(task, container, qContainer) {
  container.innerHTML = `
    <div class="text-title">${task.titel}</div>
    <div class="text-source">${task.quelle}</div>
    <div class="text-body">${task.text}</div>

  task.fragen.forEach(q => {
    const block = document.createElement('div');
    block.className = 'question-block';
    const opts = q.optionen.map(o => `
      <button class="option-btn" data-q="${q.id}" data-val="${o.id}"

    qContainer.appendChild(block);

}

      </div>
      <div class="q-explanation" id="exp-${i}"></div>
    `;
    qContainer.appendChild(block);
  }
}

// ── INTERACTIONS ──
function selectOption(btn, qId, val) {
  if (checked) return;
  document.querySelectorAll(`.option-btn[data-q="${qId}"]`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  userAnswers[qId] = val;
  updateAnsweredCount();
}

function selectTF(btn, qId, val) {
  if (checked) return;
  document.querySelectorAll(`[data-q="${qId}"]`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  userAnswers[qId] = val;
  updateAnsweredCount();
}

function updateAnsweredCount() {
  const total = document.querySelectorAll('.question-block').length;
  const answered = Object.keys(userAnswers).length;
  document.getElementById('answered-count').textContent = `${answered} / ${total} beantwortet`;
  document.getElementById('btn-check').disabled = answered < total;
}

// ── CHECK ──
function checkAnswers() {
  if (!currentTask) return;
  checked = true;
  document.getElementById('btn-check').disabled = true;

  const solutions = currentTask.loesungen || {};
  const explanations = currentTask.erklaerungen || {};
  let correct = 0;
  const total = Object.keys(solutions).length;
  const breakdown = [];

  Object.entries(solutions).forEach(([qId, correctAns]) => {
    const userAns = userAnswers[qId];
    const isCorrect = userAns === correctAns;
    if (isCorrect) correct++;

    // Style buttons
    document.querySelectorAll(`[data-q="${qId}"]`).forEach(btn => {
      const val = btn.dataset.val;
      if (val === correctAns) btn.classList.add('correct');
      else if (val === userAns && !isCorrect) btn.classList.add('wrong');
      btn.disabled = true;
    });
    document.querySelectorAll(`.option-btn[data-q="${qId}"]`).forEach(btn => {
      const val = btn.dataset.val;
      if (val === correctAns) btn.classList.add('correct');
      else if (val === userAns && !isCorrect) btn.classList.add('wrong');
      btn.disabled = true;
    });

    // Show explanation
    const expEl = document.getElementById('exp-' + qId);
    if (expEl && explanations[qId]) {
      expEl.textContent = (isCorrect ? '✓ ' : '✗ Richtig wäre ' + correctAns + '. ') + explanations[qId];
      expEl.classList.add('show');
    }

    const qText = document.querySelector(`.question-block .q-text[data-q]`) || 
      [...document.querySelectorAll('.q-text')][parseInt(qId)-1];
    breakdown.push({ qId, correct: isCorrect, ans: userAns, sol: correctAns });
  });

  // Show result
  const pct = Math.round(correct / total * 100);
  showResult(correct, total, pct, breakdown);

  // Save progress
  const key = selectedType || 'global';
  progData[key] = progData[key] || [];
  progData[key].push(pct);
  if (progData[key].length > 20) progData[key] = progData[key].slice(-20);
  localStorage.setItem('lesen_prog', JSON.stringify(progData));
  updateProgress();

  sessionScore += correct;
  sessionMax += total;
  document.getElementById('total-score').textContent = sessionScore;
  document.getElementById('total-max').textContent = sessionMax;
}

function showResult(correct, total, pct, breakdown) {
  const card = document.getElementById('result-card');
  card.classList.add('show');

  const verdicts = pct >= 80 ? 'Ausgezeichnet! ✦' : pct >= 60 ? 'Gut — weiter so!' : pct >= 40 ? 'Befriedigend' : 'Weiter üben!';
  document.getElementById('res-score').textContent = correct;
  document.getElementById('res-den').textContent = '/ ' + total;
  document.getElementById('res-title').textContent = verdicts;
  document.getElementById('res-sub').textContent = `${pct}% richtig · ${types[level].find(t=>t.id===selectedType)?.name}`;

  const scoreBox = document.querySelector('.result-score-box');
  scoreBox.style.borderColor = pct >= 80 ? 'var(--green)' : pct >= 60 ? 'var(--gold)' : 'var(--red)';
  document.getElementById('res-score').style.color = pct >= 80 ? 'var(--green)' : pct >= 60 ? 'var(--gold)' : 'var(--red)';

  const bdown = document.getElementById('result-breakdown');
  bdown.innerHTML = breakdown.map(b => `
    <div class="breakdown-item">
      <div class="breakdown-icon">${b.correct ? '✓' : '✗'}</div>
      <div class="breakdown-text">Aufgabe ${b.qId}: Deine Antwort <strong>${b.ans}</strong> — Richtig: <strong>${b.sol}</strong></div>
      <div class="breakdown-status ${b.correct ? 'status-ok' : 'status-err'}">${b.correct ? '+1' : '0'}</div>
    </div>
  `).join('');

  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

init();
</script>
</body>
</html>
